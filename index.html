const chapters=[["몽골군의 침입", "13세기, 몽골군이 고려를 침입했어요. 고려는 나라를 지키기 위해 몽골군에 맞서 싸웠습니다.", "몽골군의 침입에 고려 사람들은 어떻게 대응했나요?", ["힘을 모아 침입에 맞서 싸웠다", "아무런 저항 없이 나라를 넘겼다", "몽골을 침입했다"], 0, "고려 사람들은 몽골의 침입에 맞서 오랫동안 저항했어요."], ["강화도 천도", "무신 정권의 최우는 몽골군에 맞서기 위해 수도를 개경에서 강화도로 옮겼어요. 몽골군이 바다를 건너 공격하기 어렵다는 점을 이용한 것이지요.", "고려가 강화도로 수도를 옮긴 까닭은?", ["무역을 더 많이 하기 위해", "몽골군의 공격에 맞서 저항하기 위해", "원의 풍습을 배우기 위해"], 1, "강화도는 바다로 둘러싸여 있어 몽골군의 공격에 대응하기 유리했어요."], ["처인성 전투", "승려 김윤후와 백성들은 처인성에서 몽골군에 맞서 싸워 승리했어요. 나라를 지키려는 마음으로 여러 신분의 사람들이 힘을 합쳤습니다.", "처인성에서 몽골군을 물리치는 데 활약한 사람은?", ["공민왕", "최우", "김윤후와 백성들"], 2, "김윤후와 백성들이 함께 몽골군에 맞서 승리했어요."], ["팔만대장경", "고려 사람들은 부처의 힘으로 몽골의 침입을 물리치고 나라의 평안을 되찾기를 바라는 마음으로 팔만대장경을 만들었어요.", "팔만대장경을 만든 중요한 까닭은?", ["외침을 극복하고 나라의 평안을 빌기 위해", "몽골의 법을 기록하기 위해", "무역 상품을 만들기 위해"], 0, "고려 사람들은 나라의 평안을 바라는 마음을 담아 대장경을 새겼어요."], ["삼별초의 항쟁", "고려 정부가 몽골과 강화를 맺고 개경으로 돌아가려 하자 삼별초는 이에 반대했어요. 강화도에서 진도, 제주도로 옮겨 가며 저항을 이어 갔습니다.", "삼별초의 항쟁이 이어진 순서는?", ["제주도 → 강화도 → 진도", "강화도 → 진도 → 제주도", "진도 → 개경 → 제주도"], 1, "삼별초는 강화도에서 진도와 제주도로 옮겨 가며 항쟁했어요."], ["원의 정치 간섭", "몽골이 세운 원은 고려의 정치에 간섭했어요. 고려의 왕은 원의 공주와 혼인하기도 했고, 원은 고려에 여러 물품과 사람을 요구했습니다.", "원의 간섭을 받던 고려의 모습으로 알맞은 것은?", ["고려가 원을 다스렸다", "고려와 원은 아무런 관계가 없었다", "고려 왕이 원의 공주와 혼인하기도 했다"], 2, "원은 고려 왕실과 혼인 관계를 맺고 고려 정치에 영향력을 행사했어요."], ["생활 모습의 변화", "원 간섭기에 고려에는 원의 옷차림과 머리 모양 등 여러 풍습이 퍼졌어요. 반대로 원에서도 고려의 풍습이 유행하는 등 서로 영향을 주고받았지요.", "원 간섭기 생활 모습으로 알맞은 것은?", ["고려와 원의 풍습이 서로 영향을 주었다", "고려의 모든 문화가 사라졌다", "두 나라 사이에 문화 교류가 없었다"], 0, "원의 풍습이 고려에 전해졌고, 고려의 풍습도 원에 전해졌어요."], ["공민왕의 개혁", "원의 힘이 약해지자 공민왕은 원의 간섭에서 벗어나기 위한 개혁을 추진했어요. 원과 관련된 제도를 고치고 쌍성총관부 지역을 되찾았습니다.", "공민왕이 고려의 자주성을 회복하기 위해 한 일은?", ["원의 간섭을 더 늘렸다", "쌍성총관부 지역을 되찾았다", "수도를 강화도로 옮겼다"], 1, "공민왕은 쌍성총관부 지역을 되찾는 등 자주성을 회복하려 했어요."]].map((c,i)=>({title:c[0],story:c[1],question:c[2],choices:c[3],answer:c[4],explanation:c[5],image:images[i]}));
let step=-1,score=0,answered={},order=[3,5,1,6,0,4,2],completed=false;
const el=id=>document.getElementById(id);
function nav(){el('score').textContent='⭐ '+score+'점';el('fill').style.width=(step<0?0:Math.min(100,(step+1)/8*100))+'%';el('nav').innerHTML=chapters.map((c,i)=>`<button class="nav ${step===i?'active':''} ${answered[i]!==undefined?'done':''}" onclick="go(${i})">${i+1}. ${c.title}</button>`).join('')+`<button class="nav ${step===8?'active':''}" onclick="showTimeline()">⏳ 마지막 연표 미션 바로가기</button>`}
function start(){step=-1;nav();el('main').innerHTML=`<div class="intro"><img src="${images[0]}" alt="몽골군의 침입을 표현한 3D 애니메이션풍 그림"><h1>고려의 운명을 지켜라!</h1><p>몽골의 침입부터 원의 간섭과 공민왕의 개혁까지!<br>8개의 역사 장면을 탐험하고 핵심 문제를 풀어 보세요.<br><b>모든 학생에게 항상 같은 문제가 나옵니다.</b></p><button class="primary" onclick="go(0)">역사 탐험 시작하기 →</button><p><button class="secondary" onclick="showTimeline()">⏳ 연표 미션 바로 체험하기</button></p></div>`}
function go(i){step=i;nav();let c=chapters[i],a=answered[i];el('main').innerHTML=`<div class="content"><div class="tag">제${i+1}장 · 고려의 외침과 극복</div><h2>${c.title}</h2><img class="scene" src="${c.image}" alt="${c.title} 역사 장면"><div class="story">${c.story}</div><div class="question">🔍 역사 탐정 미션 · ${c.question}</div><div class="answers">${c.choices.map((v,j)=>`<button class="choice ${a!==undefined?(j===c.answer?'correct':j===a?'wrong':''):''}" ${a!==undefined?'disabled':''} onclick="choose(${j})">${j+1}. ${v}</button>`).join('')}</div><div id="feedback">${a!==undefined?feedback(c,a):''}</div><div class="controls"><button class="secondary" onclick="${i===0?'start()':`go(${i-1})`}">← 이전</button><button class="primary" id="next" ${a===undefined&&i!==7?'disabled':''} onclick="${i===7?'showTimeline()':`go(${i+1})`}">${i===7?'연표 미션 →':'다음 장면 →'}</button></div></div>`}
function feedback(c,a){return `<div class="feedback"><b>${a===c.answer?'🎉 정답! +10점':'💡 정답은 '+(c.answer+1)+'번이에요.'}</b><div>${c.explanation}</div></div>`}
function choose(j){if(answered[step]!==undefined)return;answered[step]=j;if(j===chapters[step].answer)score+=10;go(step)}
const events=['몽골군의 침입','강화도 천도','처인성 전투','팔만대장경 제작','삼별초의 항쟁','원의 간섭','공민왕의 개혁'];
function showTimeline(message='') {
  step=8;
  nav();
  const items=order.map((eventId,index)=>`<div class="event" data-index="${index}">
    <b>${index+1}</b><span>${events[eventId]}</span>
    <button type="button" data-move="-1" data-index="${index}" aria-label="위로 이동">▲</button>
    <button type="button" data-move="1" data-index="${index}" aria-label="아래로 이동">▼</button>
  </div>`).join('');
  el('main').innerHTML=`<div class="content">
    <span class="tag">마지막 역사 미션</span><h2>⏳ 고려 역사 연표 만들기</h2>
    <p>▲ ▼ 버튼으로 역사 사건을 시간 순서대로 배열한 뒤 정답을 확인하세요.</p>
    <div class="timeline">${items}</div>
    ${message?`<div class="feedback" role="status">${message}</div>`:''}
    <div class="controls"><button type="button" id="backChapter" class="secondary">← 이전 장면</button>
    <button type="button" id="checkTimeline" class="primary">순서 확인하기</button></div>
  </div>`;
  el('main').querySelectorAll('[data-move]').forEach(button=>{
    button.addEventListener('click',()=>{
      const i=Number(button.dataset.index),j=i+Number(button.dataset.move);
      if(j<0||j>=order.length)return;
      [order[i],order[j]]=[order[j],order[i]];
      showTimeline();
    });
  });
  el('checkTimeline').addEventListener('click',()=>{
    if(order.every((value,index)=>value===index)){
      if(!completed){score+=20;completed=true}
      nav();
      el('main').innerHTML=`<div class="intro"><h1>🎉 고려 역사 탐정 인증!</h1>
        <h2>최종 ${score} / 100점</h2>
        <p>몽골의 침입 → 강화도 천도 → 고려의 항쟁 → 원의 간섭 → 공민왕의 개혁</p>
        <p><b>생각해 보기:</b> 고려 사람들은 외침 속에서 무엇을 지키려 했을까요?</p>
        <button type="button" id="restartGame" class="primary">처음부터 다시 탐험하기</button></div>`;
      el('restartGame').addEventListener('click',restart);
    }else{
      showTimeline('아직 순서가 맞지 않아요. 몽골군의 침입이 먼저, 공민왕의 개혁이 마지막이에요.');
    }
  });
  el('backChapter').addEventListener('click',()=>go(7));
}
function restart(){score=0;answered={};completed=false;order=[3,5,1,6,0,4,2];start()}
start();
</script></body></html>
